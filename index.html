<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dito 레시피 갤러리</title>
<style>
  :root {
    --bg:        #fafaf7;
    --card:      #ffffff;
    --border:    #e5e3dd;
    --text:      #1a1a1a;
    --muted:     #888;
    --accent:    #2a6f4f;
    --tag-bg:    #f0eee7;
    --shadow:    0 2px 8px rgba(0,0,0,0.04);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  header {
    max-width: 1400px;
    margin: 0 auto 24px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 600;
  }
  .meta {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }
  input[type="search"] {
    flex: 1;
    min-width: 240px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--card);
  }
  input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .filter-chip {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;
  }
  .filter-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .card img.thumb {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #f0f0f0;
    display: block;
  }
  .card .body {
    padding: 14px;
  }
  .card .menu {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .card .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .tag {
    background: var(--tag-bg);
    color: var(--text);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
  }
  .tag.score {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  /* 펼친 상세 */
  .detail {
    display: none;
    padding: 16px;
    background: #fdfcf7;
    border-top: 1px solid var(--border);
  }
  .detail.open { display: block; }
  .detail h3 {
    margin: 12px 0 6px;
    font-size: 14px;
    color: var(--accent);
  }
  .detail h3:first-child { margin-top: 0; }
  .detail ul, .detail ol {
    margin: 0;
    padding-left: 20px;
    font-size: 13px;
  }
  .detail li { margin-bottom: 4px; }
  .meta-row {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .meta-row span { white-space: nowrap; }
  .step-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    margin-top: 8px;
  }
  .step-grid figure {
    margin: 0;
    text-align: center;
  }
  .step-grid img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .step-grid figcaption {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.2;
  }
  .source-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { text-decoration: underline; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    grid-column: 1 / -1;
  }
</style>
</head>

    <button class="filter-chip active" data-cuisine="">전체</button>
    <span id="cuisine-filters"></span>
  </div>
</header>

<div class="grid" id="grid"></div>

, "분류": "주재료"}, {"이름": "도가니", "수량": "1kg", "분류": "주재료"}, {"이름": "물", "수량": "6~9L (고기 무게의 2~3배)", "분류": "기타"}, {"이름": "무", "수량": "1개 (약 600~900g)", "분류": "주재료"}, {"이름": "양파", "수량": "1개 (고기 1kg당 0.5개)", "분류": "주재료"}, {"이름": "대파", "수량": "3대 (고기 1kg당 1대)", "분류": "주재료"}, {"이름": "통마늘", "수량": "15~20알", "분류": "양념"}, {"이름": "통후추", "수량": "3큰술 (고기 1kg당 1큰술)", "분류": "양념"}, {"이름": "월계수 잎", "수량": "3장 (고기 1kg당 1장)", "분류": "양념"}, {"이름": "천일염 (또는 새우젓·간장·멸치액젓)", "수량": "적당량", "분류": "양념"}], "steps": ["고기를 전처리해 주세요. 찬물에 30분~1시간 담가 핏물을 빼거나, 냄비에 고기가 잠길 만큼 물을 붓고 10~15분 끓인 뒤 물을 버리고 냄비를 씻어주세요. 건강을 더 중시한다면 찬물에 담가 핏물 빼는 방법을 추천드려요.", "무, 양파, 대파를 큼직하게 썰어 준비해 주세요.", "육수 거름망에 통마늘, 통후추, 월계수 잎을 넣어 주세요.", "큰 냄비에 전처리한 고기를 넣고, 고기 무게의 2~3배에 해당하는 물(6~9L)을 부어 주세요. 거름망과 썰어둔 무·양파·대파도 함께 넣어 주세요.", "강불에서 물이 끓어오를 때까지 가열한 뒤, 물이 끓기 시작하면 중약불로 줄여 주세요.", "중약불에서 1시간 30분 정도 끓여 주세요. 이 시점이 되면 무·양파·대파·거름망 속 향신채가 충분히 우러났을 테니 모두 꺼내 주세요.", "육수 간을 확인하고 천일염, 새우젓, 멸치액젓, 간장 중 원하시는 것으로 입맛에 맞게 간을 맞춰 주세요.", "1시간 더 끓인 뒤 사태를 꺼내 주세요. 이후 30분을 더 끓인 다음 스지와 도가니도 꺼내 주세요.", "마지막으로 간을 한 번 더 확인하고 필요하면 조정해 주세요.", "완성된 육수는 체에 걸러 따로 보관해 두고, 고기는 건져 따뜻하게 드시거나 요리에 활용해 주세요."], "step_tips": ["건강 목적이 우선이라면 찬물 핏물 빼기(1안)를 추천드려요. 끓여서 버리는 2안은 영양 손실이 있을 수 있어요.", "", "장이 예민하신 분은 마늘 양을 줄이거나 빼셔도 괜찮아요.", "샐러리를 추가하면 조금 더 고급스러운 서양 요리 풍미가 나요.", "강불이 아닌 중약불로 천천히 끓이는 것이 포인트예요. 약불에서 오래 끓여야 고기가 부드럽게 풀어져요.", "무·파·양파가 흐물흐물해졌을 때 꺼내시면 돼요. 너무 오래 두면 국물이 탁해질 수 있어요.", "멸치액젓을 사용하신다면 물 6L 기준으로 약 6큰술을 넣고 가감해 보세요. 너무 짜다면 물을 조금 더 넣어 주세요.", "사태는 2시간 30분, 스지·도가니는 3시간 이상 끓여야 충분히 부드러워져요.", "", "국물을 유리병에 담아 냉장 또는 냉동 보관해 두면 필요할 때마다 데워 드실 수 있어요."], "source_url": "https://www.youtube.com/watch?v=HaeALh_31bo&t=1s", "hero_local": "images/갭스식_고기_육수__HaeALh_31b.webp", "step_images": []}, {"menu": "고기·두부용 들기름 소스", "subtitle": "", "cuisine": "소스/드레싱", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저당"], "situations": [], "audiences": ["다이어터"], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "간장 : "1/2개 (85g)", "분류": "주재료"}, {"이름": "새송이버섯", "수량": "1개 (85g)", "분류": "주재료"}, {"이름": "생크림", "수량": "200ml", "분류": "주재료"}, {"이름": "버터", "수량": "22g", "분류": "양념"}, {"이름": "올리브오일", "수량": "조금", "분류": "양념"}, {"이름": "소금", "수량": "3꼬집", "분류": "양념"}, {"이름": "식초 (애플사이다비네거)", "수량": "1스푼", "분류": "기타"}, {"이름": "파르미지아노 레지아노", "수량": "2스푼", "분류": "고명"}, {"이름": "건 파슬리 파우더", "수량": "조금", "분류": "고명"}], "steps": ["곤약면 패키지의 보존액을 버리고 흐르는 물에 헹군 뒤, 면이 잠길 만큼의 물에 애플사이다비네거 1스푼을 넣고 잠시 담가 특유의 냄새를 제거한다.", "새송이버섯은 물 세척 대신 키친타올로 표면을 닦은 뒤 반달 모양으로 썰고, 양파는 깍둑썰기로 썬다.", "식초물에 담가둔 곤약면을 깨끗한 물로 헹군 후 물기가 최대한 없도록 꼭 짠다.", "예열된 팬에 올리브오일을 두르고 양파(85g)를 투명해질 때까지 볶는다.", "양파가 투명해지면 새송이버섯(85g)을 넣고 버섯이 오일을 흡수할 때까지 볶는다.", "소금 3꼬집을 넣고 소금이 재료에 배도록 함께 볶는다.", "생크림 200ml를 넣고 끓어오르면 중불로 줄여 묽은 크림이 살짝 걸쭉해질 때까지 끓인다.", "크림이 약간 걸쭉해지면 버터 22g을 넣어 녹이면서 농도를 더 진하게 만든다.", "물기를 제거한 곤약파스타면(200g)을 넣고 크림이 면과 잘 어우러지도록 졸인다.", "크림 농도가 꾸덕해지면 파르미지아노 레지아노 1스푼을 넣고 전체적으로 녹을 때까지 저어 완성한다.", "그릇에 담은 뒤 파르미지아노 레지아노 1스푼과 파슬리 파우더를 뿌려 마무리한다."], "step_tips": ["담가두는 시간은 수 분 정도로 충분하며, 이후 반드시 깨끗한 물로 다시 헹궈준다.", "버섯을 물로 씻으면 식감이 물러질 수 있으므로 키친타올로 닦는 것이 좋다. 꼭 씻어야 한다면 흐르는 물에 재빨리 헹군 후 물기를 완전히 제거한다.", "물기가 남아 있으면 소스가 묽어지므로 최대한 꼭 짜는 것이 중요하다.", "", "", "", "생크림이 끓어오른 후 중불로 낮춰야 크림이 타지 않고 부드럽게 졸아든다.", "버터를 넣으면 크림 농도가 더 진해지고 풍미가 깊어진다.", "곤약면에 크림이 충분히 배어들도록 저어가며 졸인다.", "파르미지아노 레지아노는 숙성이 길수록 감칠맛이 진하다.", "취향에 따라 키토 베이컨이나 미트볼을 추가해도 맛있다."], "source_url": "https://youtu.be/xkdJ5QuKYec", "hero_local": "images/곤약_크림_파스타__xkdJ5QuKYe.webp", "step_images": []}, {"menu": "굴계절솥밥 with 달래양념장", "subtitle": "제철 굴로 만드는 겨울 별미", "cuisine": "한식", "score": 0, "tags": ["최소가공", "혈당 안전", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["단백질"], "situations": ["한그릇"], "audiences": ["1인가구", "직장인"], "difficulty": "중급", "cooking_time": 90, "serving": "2인분", "calorie": 480, "storage": "냉장 1일 이내 섭취 권장 (굴이 들어있어 빠른 섭취 필요)", "ingredients": [{"이름": "생굴", "수량": "300g", "분류": "주재료"}, {"이름": "불린 쌀", "수량": "2컵", "분류": "주재료"}, {"이름": "무", "수량": "100g", "분류": "주재료"}, {"이름": "말린 표고버섯", "수량": "2개", "분류": "주재료"}, {"이름": "표고버섯 우린 물", "수량": "2컵", "분류": "기타"}, {"이름": "참기름", "수량": "1작은술", "분류": "양념"}, {"이름": "레몬", "수량": "약간", "분류": "기타"}, {"이름": "소금", "수량": "약간", "분류": "양념"}, {"이름": "달래", "수량": "100g", "분류": "주재료"}, {"이름": "청양고추", "수량": "3개", "분류": "주재료"}, {"이름": "붉은 고추", "수량": "1개", "분류": "주재료"}, {"이름": "쪽파", "수량": "5대", "분류": "고명"}, {"이름": "다진 마늘", "수량": "1큰술", "분류": "양념"}, {"이름": "고춧가루", "수량": "1큰술", "분류": "양념"}, {"이름": "진간장", "수량": "5큰술", "분류": "양념"}, {"이름": "참기름 (양념장용)", "수량": "2큰술", "분류": "양념"}, {"이름": "깻가루", "수량": "2큰술", "분류": "양념"}, {"이름": "구운 김 부순 것", "수량": "약간", "분류": "고명"}], "steps": ["말린 표고버섯 2개를 생수에 담가 30분간 불려 표고버섯 우린 물을 만들고, 건진 표고버섯은 너무 굵지도 얇지도 않게 두께감 있게 채 썰어 준비해주세요.", "무 100g은 연초록 부분으로 준비해 나무젓가락 굵기(너무 굵지도 얇지도 않은 두께)로 채 썰어 주세요.", "슬라이스한 레몬 3조각과 소금 1큰술을 물에 녹여 레몬 소금물을 만들어 주세요. 생굴은 흐르는 물에 한 번 헹군 뒤 레몬 소금물에 담가 비린맛을 제거하고 건져 물기를 빼 주세요.", "쌀 2컵을 깨끗이 씻어 물에 30분 담갔다가 건져서 다시 30분 둔 뒤 솥(냄비)에 넣어 주세요. 표고버섯 우린 물 2컵을 동량으로 붓고, 무채와 채 썬 표고버섯을 올린 뒤 잘 섞고 뚜껑을 덮어 불을 켜 주세요.", "손질한 굴에 참기름 1작은술을 넣고 골고루 코팅해 주세요. 기름 코팅을 해야 밥을 지은 후에도 굴이 오돌오돌하게 모양이 살아있어요.", "달래는 깨끗이 씻은 후 알뿌리 부분을 칼 날로 눌러 으깨고 맑은 물에 헹궈 아린맛을 제거한 뒤 0.5~1cm 간격으로 썰어 주세요.", "솥에서 김이 보글보글 올라오면 참기름으로 코팅한 굴을 듬성듬성 올리고 뚜껑을 덮어 약한 불로 10분간 뜸을 들여 주세요.", "뜸을 들이는 동안 쪽파는 송송 썰고, 청양고추와 붉은 고추는 얇게 썰어 두 번 갈라 준비해 주세요.", "그릇에 달래, 쪽파, 청양고추, 붉은 고추, 다진 마늘 1큰술, 고춧가루 1큰술, 진간장 5큰술, 참기름 2큰술, 깻가루 2큰술, 구운 김 부순 것을 모두 넣고 잘 섞어 달래양념장을 만들어 주세요.", "10분 뜸이 끝나면 불을 끄고 뚜껑을 닫은 채로 1분을 더 기다려 주세요. 이후 뚜껑을 열어 굴솥밥을 그릇에 담고 달래양념장을 곁들여 마무리해 주세요."], "step_tips": ["표고버섯 우린 물은 맑고 깨끗한 생수를 사용하면 더 좋아요. 이 물로 밥물을 잡으면 풍미가 훨씬 깊어져요.", "무는 연초록 부분이 단맛이 가장 강하니 그 부분을 골라 사용해주시면 좋아요.", "레몬 소금물에 굴을 헹구면 비린맛이 줄고 훨씬 싱그러운 맛이 살아나요.", "밥물은 쌀과 표고버섯 우린 물을 동량(2컵 대 2컵)으로 맞춰주세요. 무와 표고버섯에서 수분이 나오기 때문에 물을 더 넣으면 밥이 질어질 수 있어요.", "참기름 코팅을 꼭 해주셔야 굴이 밥 안에서 퍼지지 않고 오돌오돌하게 살아있어요.", "달래 알뿌리를 칼 날로 눌러 으깬 뒤 헹궈주시면 아린맛이 빠져 훨씬 구수하고 맛있어요.", "굴을 넣고 나서는 뚜껑을 열지 말고 약한 불 그대로 10분을 채워주세요. 중간에 열면 수분이 날아가요.", "", "", "불을 끈 후 1분을 더 기다려야 밥이 더 포슬포슬하게 완성돼요. 이 1분이 의외로 중요하답니다!"], "source_url": "https://youtu.be/B5dF5Zc7cKo", "hero_local": "images/굴계절솥밥_with m/shorts/ToKD5bKEpQM", "hero_local": "images/다이어트_밀프렙__shorts_ToKD5bKEp.webp", "step_images": []}, {"menu": "다이어트 샐러드 (크리미 샐러드 + 김 조합)", "subtitle": "", "cuisine": "", "score": 0, "tags": [], "purposes": [], "situations": [], "audiences": [], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "샐러드 채소", "수량": "적당량"}, {"이름": "김", "수량": "적당량"}, {"이름": "크리미 드레싱 재료", "수량": "적당량"}], "steps": ["재료를 용기에 모두 넣는다.", "뚜껑을 닫고 흔들어 잘 섞으면 완성된다."], "step_tips": [], "source_url": "https://youtu.be/MYT_bPbR_0I", "hero_local": "images/MYT_bPbR_0I.webp", "step_images": []}, {"menu": "다이어트 스테이크 플레이트 (소고기 스테이크, 브로콜리, 방울토마토, 볶은 양파, 감자)", "subtitle": "", "cuisine": "", "score": 0, "tags": [], "purposes": [], "situations": [], "audiences": [], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "소고기 (2등급)", "수량": "300g (1회 식사 150g 기준 2인분)"}, {"이름": "감자 (껍질째)", "수량": "1개 (약 70g)"}, {"이름": "브로콜리 (줄기 포함)", "수량": "70~80g"}, {"이름": "방울토마토", "수량": "적당량"}, {"이름": "양파", "수량": "적당량"}, {"이름": "올리브오일", "수량": "적당량"}, {"이름": "소금", "수량": "적당량"}, {"이름": "후추", "수량": "적당량"}, {"이름": "다진 마늘", "수량": "적당량"}, {"이름": "파슬리", "수량": "적당량"}, {"이름": "타바스코", "수량": "적당량"}, {"이름": "화이트 발사믹 식초 (또는 화이트 와인 식초)", "수량": "적당량"}, {"이름": "디종 머스타드", "수량": "적당량"}], "steps": ["소고기는 키친타월이나 해동지를 이용해 드립(핏물)을 충분히 제거한 뒤 냉장고에 넣어 차갑게 보관한다.", "감자는 껍질을 벗기지 않고 깨끗이 씻은 뒤 소금물(소금 농도 약 2%)에 삶는다. 다 익으면 바로 건지지 않고 소금물에 잠시 두어 간이 배도록 한다.", "브로콜리는 줄기째 한 입 크기로 손질한다. 줄기 부분은 칼집만 넣고 손으로 뜯어 분리하며 버리지 않는다.", "손질한 브로콜리를 비닐봉투에 넣고 올리브오일, 소금, 후추를 넣어 봉투 안에서 골고루 버무린다. 봉투 끝을 느슨하게 매듭지어 전자레인지에서 1분간 가열한다. (봉투를 꽉 묶으면 수증기로 인해 터질 수 있으므로 느슨하게 묶는다.)", "방울토마토는 반으로 갈라 씨 부분의 흰 속심을 제거한다. 올리브오일, 다진 마늘, 소금, 후추, 파슬리, 타바스코를 넣고 전자레인지에서 30초간 가열하거나 끓는 물에 살짝 데친다.", "양파는 최대한 얇게 썰어 차가운 팬에 올리브오일, 소금, 후추와 함께 넣고 약한 불에서 천천히 숨이 죽도록 볶는다(리오네이즈 방식). 양파에서 나온 수분과 오일이 유화되도록 저으며 익히고, 중간에 다진 마늘을 추가한다. 수분이 부족하면 물을 조금 더 넣는다.", "비니그렛 소스를 만든다. 올리브오일과 화이트 발사믹 식초(또는 화이트 와인 식초)를 1:3~3.5 비율(신맛을 줄이려면 1:5)로 섞고, 식초 양 대비 1 비율의 디종 머스타드를 넣어 잘 흔들어 유화시킨다. 소금과 후추로 간을 맞추고, 상온에서 최대 45일 보관 가능하다.", "드립을 제거한 소고기를 올리브오일을 두른 팬에 올리고, 10초 이내에 한 번 뒤집어 한쪽으로 휘지 않게 한다. 원하는 굽기로 스테이크를 완성한다.", "스테이크를 구운 팬에 삶아둔 감자를 넣어 팬에 남은 육즙과 누룽지가 감자에 배도록 볶는다.", "접시에 스테이크, 감자(껍질째), 브로콜리, 방울토마토, 볶은 양파를 함께 담고 비니그렛 소스와 파슬리를 올려 완성한다."], "step_tips": [], "source_url": "https://www.youtube.com/watch?v=o7or7GEOgJQ", "hero_local": "images/watch.webp", "step_images": []}, {"menu": "다이어트 초코 케이크 (오븐 & 전자레인지 버전)", "subtitle": "밀가루·설탕 없는 저당 초코 케이크", "cuisine": "디저트/간식", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저당", "칼로리"], "situations": [], "audiences": ["다이어터"], "difficulty": "중급", "cooking_time": 70, "serving": "4인분", "calorie": 380, "storage": "냉장 3일", "ingredients": [{"이름": "아몬드 가루", "수량": "150g (종이컵 2컵)", "분류": "주재료"}, {"이름": "무가당 코코아 파우더", "수량": "30g (3큰술)", "분류": "주재료"}, {"이름": "베이킹파우더", "수량": "5g (1작은술)", "분류": "기타"}, {"이름": "감미료", "수량": "70g (5큰술)", "분류": "양념"}, {"이름": "소금", "수량": "한 꼬집", "분류": "양념"}, {"이름": "달걀", "수량": "3개 (실온)", "분류": "주재료"}, {"이름": "버터", "수량": "70g", "분류": "주재료"}, {"이름": "우유", "수량": "2큰술 (30ml)", "분류": "기타"}, {"이름": "생크림", "수량": "100ml", "분류": "주재료"}, {"이름": "85% 다크 초콜릿", "수량": "100g", "분류": "주재료"}], "steps": ["아몬드 가루, 코코아 파우더, 베이킹파우더를 채망에 함께 넣고 체 쳐서 고루 섞어주세요. 체에 남은 거친 가루는 반죽 퀄리티를 위해 사용하지 않아도 돼요.", "버터 70g을 적당한 크기로 썰어 전자레인지에 약 1분간 돌려 녹여주세요. 너무 뜨거우면 반죽이 익을 수 있으니 살살 저어 적당히 식혀주세요.", "실온 달걀 3개에 감미료 70g을 넣고 잘 섞어주세요. 감미료가 잘 녹지 않는다면 그릇 아래에 뜨거운 물을 받쳐 중탕으로 천천히 저어주시면 금세 녹아요.", "달걀 혼합물에 소금 한 꼬집을 넣고 매끈하게 풀어주세요.", "녹인 버터를 달걀 혼합물에 넣고, 자르듯 빙빙 돌리며 한 곳에 뭉치지 않게 잘 섞어주세요.", "체 쳐 놓은 가루 재료를 넣고 코코아 파우더가 뭉치지 않도록 생각보다 충분히 섞어주세요. 그런 다음 우유 2큰술을 넣고 반죽이 매끈하게 흘러내릴 정도로 마무리해주세요.", "[오븐 버전] 파운드 틀(15×5.5cm 기준) 안쪽에 유산지를 깔고 반죽을 틀의 2/3 정도 채워주세요. 표면을 평평하게 고른 뒤 160℃로 예열한 오븐에서 40~50분간 구워주세요.", "[전자레인지 버전] 내열 용기에 반죽을 1/2 정도 담아주세요. 전자레인지에 먼저 2분 돌린 뒤, 익은 정도를 확인하며 1분씩 추가로 돌려주세요. 총 4분 정도가 기준이지만, 전자레인지 성능에 따라 다를 수 있어요.", "가나슈를 만들어주세요. 다크 초콜릿 100g을 잘게 썰어 준비해주세요. 생크림 100ml를 전자레인지에 1분 돌려 따뜻하게 만든 뒤(끓이면 안 돼요), 잘게 썬 초콜릿을 넣고 천천히 저어 완전히 녹여주세요. 계속 저으면 색이 진해지면서 반짝반짝 매끈한 가나슈가 완성돼요.", "완성된 케이크 위에 가나슈를 고루 부어주세요. 틀을 이리저리 기울여 표면을 평탄하게 고른 뒤 냉장고에 넣어 굳혀주세요.", "냉장고에서 충분히 굳힌 뒤 꺼내어 틀 모서리를 살짝 눌러 케이크를 분리하고, 유산지를 조심스럽게 벗겨 완성해주세요."], "step_tips": ["코코아 파우더는 뭉치기 쉬우니 체 치는 과정을 꼭 거쳐주세요. 이렇게 하면 가루 사이에 공기가 들어가 더 포실한 식감을 낼 수 있어요.", "버터가 너무 뜨거우면 달걀 반죽이 익어버릴 수 있으니 꼭 식힌 후 사용해주세요.", "달걀은 반드시 실온 상태로 사용해주세요. 차가운 달걀은 감미료가 잘 녹지 않아요.", "", "", "우유는 생략해도 되지만 넣으면 훨씬 부드럽고 촉촉한 밀크 초콜릿 느낌이 나요.", "반죽은 틀의 2/3 정도만 채워주세요. 너무 가득 채우면 구울 때 넘칠 수 있어요.", "전자레인지 성능에 따라 시간이 다를 수 있으니 2분 후 익은 정도를 꼭 확인하며 추가로 돌려주세요.", "생크림은 부글부글 끓이지 않고 따뜻한 정도로만 데워주세요. 끓이면 가나슈 질감이 달라질 수 있어요. 좀 더 달콤한 맛을 원하신다면 감미료 2/3큰술을 추가해도 좋아요.", "", ""], "source_url": "https://youtu.be/tC_dp8tpJKU", "hero_local": "images/다이어트_초코_케이크_오븐_&_전자레인지_버전__tC_dp8tpJK.webp", "step_images": []}, {"menu": "다이어트 포케 샐러드 밀프렙 도시락", "subtitle": "식비 아끼는 건강 밀프렙", "cuisine": "샐러드", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "Dito 추천"], "purposes": ["칼로리", "저당", "단백질"], "situations": ["밀프렙", "도시락"], "audiences": ["1인가구", "직장인", "다이어터"], "difficulty": "초급", "cooking_time": 25, "serving": "2인분 (도시락 2통)", "calorie": 350, "storage": "냉장 2~3일 보관 가능 (드실 때 드레싱은 따로 보관 권장)", "ingredients": [{"이름": "방울토마토", "수량": "적당량", "분류": "주재료"}, {"이름": "오이", "수량": "1개", "분류": "주재료"}, {"이름": "양상추", "수량": "적당량", "분류": "주재료"}, {"이름": "계란", "수량": "적당량", "분류": "주재료"}, {"이름": "두부", "수량": "1모", "분류": "주재료"}, {"이름": "느타리버섯", "수량": "적당량", "분류": "주재료"}, {"이름": "참치 (기름 뺀 것)", "수량": "2캔", "분류": "주재료"}, {"이름": "저당 마요네즈", "수량": "3스푼", "분류": "양념"}, {"이름": "알룰로스", "수량": "2스푼", "분류": "양념"}, {"이름": "식용유", "수량": "적당량", "분류": "기타"}], "steps": ["오이는 속을 파낸 뒤 먹기 좋은 크기로 썰어주세요.", "방울토마토는 반으로 잘라주시고, 삶은 계란도 적당한 크기로 잘라 준비해주세요.", "양상추는 손으로 먹기 좋게 찢어주세요.", "기름을 두른 팬에 느타리버섯과 두부를 노릇하게 구워주세요.", "기름을 뺀 참치 2캔에 저당 마요네즈 3스푼과 알룰로스 2스푼을 넣고 잘 섞어주세요.", "도시락 통에 양상추를 깔아주고, 그 위에 방울토마토·계란·느타리버섯·오이를 차례로 담아주세요.", "한 통에는 두부를 듬뿍 올려 두부 포케로, 다른 한 통에는 참치 마요를 듬뿍 올려 참치 포케로 완성해주세요."], "step_tips": ["오이 속을 파내면 수분이 줄어 도시락이 덜 눅눅해져요. ": "1스푼", "분류": "양념"}, {"이름": "고춧가루", "수량": "1/2큰술", "분류": "양념"}, {"이름": "참기름", "수량": "1큰술", "분류": "양념"}, {"이름": "참깨", "수량": "적당량", "분류": "고명"}, {"이름": "대파", "수량": "적당량", "분류": "고명"}, {"이름": "청양고추", "수량": "적당량 (취향껏)", "분류": "고명"}], "steps": ["쌀을 정수 물로 3~4번 가볍게 헹궈주세요. 첫 물은 반드시 정수를 사용해주세요.", "씻은 쌀을 정수 물에 담가 20~30분 동안 불려주세요. 쌀이 하얗게 변하면 잘 불린 거예요.", "버섯은 물에 오래 담그지 말고, 솔이나 젖은 행주로 살살 닦거나 흐르는 물에 빠르게 씻어주세요. 표고버섯 꼭지는 잘라서 냉동 보관해 두시면 나중에 육수로 활용할 수 있어요.", "버섯을 먹기 좋은 크기로 썰거나 뜯어서 준비해주세요. 넣을까 말까 고민될 정도로 넉넉하게 준비해 주세요.", "불린 쌀의 물을 따라낸 뒤 냄비에 쌀을 넣고, 쌀과 같은 비율의 물을 부어주세요. 간장 1스푼을 넣고 가볍게 섞어주세요.", "다시마 1~2조각을 넣고 준비한 버섯을 모두 넣어주세요.", "뚜껑을 덮고 센 불에 올려주세요. 밥이 바글바글 끓어오르면 다시마를 꺼내주세요.", "다시 뚜껑을 덮고 중불로 줄여 7분간 익혀주세요.", "이어서 약불로 줄여 7~8분간 뜸을 들여주세요.", "양념장을 만들어주세요. 간장 3스푼, 물 1스푼, 고춧가루 1/2큰술, 참깨, 참기름을 넣고 잘 섞어주세요. 대파나 청양고추는 취향에 따라 추가해주세요.", "뚜껑을 열어 밥을 그릇에 담고, 양념장을 조금씩 넣어가며 비벼 드세요."], "step_tips": ["쌀이 첫 번째 물을 가장 많이 흡수하기 때문에 정수를 꼭 사용해주세요.", "쌀이 하얗고 불투명하게 변하면 충분히 불린 상태예요.", "버섯은 수분을 잘 흡수하기 때문에 물에 오래 담가두면 요리할 때 질퍽해질 수 있어요. 빠르게 씻어주세요.", "버섯은 많이 넣을수록 풍미가 깊어져요. '이게 너무 많은 거 아닐까?' 싶을 만큼 넉넉하게 넣어주세요.", "", "", "센 불에서 너무 오래 두면 냄비 바닥이 탈 수 있으니, 끓어오르는 것을 확인하는 즉시 다시마를 건져주세요.", "", "약불 뜸 들이기가 솥밥의 핵심이에요. 이 단계를 충분히 지켜주셔야 밥이 고슬고슬하게 완성돼요.", "처음에는 간장 양을 조금 넣어 간을 본 뒤 조금씩 추가하는 게 짜지 않게 먹는 방법이에요.", ""], "source_url": "https://youtu.be/fPWPueQVBac", "hero_local": "images/버섯_솥밥__fPWPueQVBa.webp", "step_images": []}, {"menu": "버터 장조림 덮밥", "subtitle": "짭조름 버터향 가득 장조림", "cuisine": "한식", "score": 0, "tags": ["최소가공", "혈당 안전", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저당", "단백질"], "situations": ["밀프렙", "도시락", "한그릇"], "audiences": ["1인가구", "직장인"], "difficulty": "초급", "cooking_time": 45, "serving": "4인분", "calorie": 480, "storage": "냉장 3일 / 냉동 1~2개월 이내 섭취 권장", "ingredients": [{"이름": "메추리알", "수량": "40알", "분류": "주재료"}, {"이름": "소고기 양지 (또는 소고기 다짐육)", "수량": "270g", "분류": "주재료"}, {"이름": "밥", "수량": "4인분", "분류": "주재료"}, {"이름": "간장", "수량": "3큰술 + 추가 1큰술", "분류": "양념"}, {"이름": "알룰로스", "수량": "3큰술 + 추가 1큰술", "분류": "양념"}, {"이름": "미림", "수량": "3큰술 + 추가 1 es": []}, {"menu": "비키당 랩 (저탄수 또띠아)", "subtitle": "당질 0.7g, 비건·키토·당뇨 완벽 대응", "cuisine": "반찬/사이드", "score": 0, "tags": ["혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저당", "칼로리"], "situations": ["밀프렙", "도시락"], "audiences": ["다이어터", "1인가구"], "difficulty": "초급", "cooking_time": 45, "serving": "8장 (1장 기준)", "calorie": 56, "storage": "냉동 보관 후 필요할 때 꺼내 5분 해동하여 섭취", "ingredients": [{"이름": "코코넛 가루 (coconut flour)", "수량": "적당량", "분류": "주재료"}, {"이름": "차전자피 파우더", "수량": "적당량", "분류": "주재료"}, {"이름": "베이킹 파우더", "수량": "적당량", "분류": "기타"}, {"이름": "소금 (핑크소금)", "수량": "적당량", "분류": "양념"}, {"이름": "올리브유 (또는 아보카도유·코코넛유)", "수량": "적당량", "분류": "양념"}, {"이름": "약간 뜨거운 물", "수량": "적당량", "분류": "기타"}], "steps": ["코코넛 가루(coconut flour), 차전자피 파우더, 베이킹 파우더, 소금을 한데 섞어 건식 재료를 미리 준비해주세요.", "큰 볼에 올리브유(또는 아보카도유·코코넛유)를 담고, 약간 뜨거운 물을 부어주세요.", "액체 재료가 담긴 큰 볼에 준비한 건식 재료를 모두 넣고 포크로 고루 섞어 반죽을 만들어주세요.", "완성된 반죽을 8등분(1개당 70~75g)으로 나눠주세요.", "유산지 위에 반죽을 올리고, 먼저 손으로 동그랗게 모양을 잡으며 눌러준 뒤 밀대로 얇게 펴주세요. 냄비 뚜껑을 대고 모양을 자른 후 남은 자투리 반죽을 이어 붙여 깔끔하게 정리해주세요.", "동그란 유산지를 반죽 위에 덮고 뒤집어서 준비해주세요. (기름 없이 굽기 위한 준비입니다.)", "팬을 약불에 올리고 반죽을 올려 앞면을 구워주세요. 표면에서 '쓱쓱' 소리가 나기 시작하면 뒤집어 반대쪽도 구워주세요.", "같은 방법으로 8장을 모두 구운 뒤 완전히 식혀주세요.", "식힌 랩은 지퍼백에 넣어 냉동 보관해주세요. 드실 때는 꺼내서 5분 정도 해동하면 유들유들하게 돌아와요.", "랩 위에 원하는 속 재료(햄, 고다 치즈, 에그 샐러드, 아보카도 마요, 머스타드, 채소 등)를 올리고, 유산지를 마름모 형태로 놓은 뒤 양옆 날개를 접어 넣고 끝까지 말아주세요. 겉을 호일로 감싸 고정한 후 사선으로 잘라 드시면 먹기 편해요."], "step_tips": ["코코넛 가루는 반드시 'coconut flour'를 사용해주세요. 코코넛 분말(coconut powder)과는 전혀 다른 재료예요.", "물은 따뜻한 것보다 약간 뜨거운 정도가 반죽 완성도에 더 좋아요.", "볼은 넉넉하게 큰 것을 사용해주세요. 작은 볼에서 섞으면 가루가 날릴 수 있어요.", "", "밀대로 바로 펴는 것보다 손으로 먼저 동그란 모양을 잡은 뒤 미는 게 훨씬 수월해요.", "", "바닥에 반죽이 붙었다면 무리하게 들어 올리지 마시고, 은근한 약불로 그대로 두시면 구워지면서 자연스럽게 떨어져요.", "", "냉동 보관 시 장기간 두셔도 되고, 해동 후 5분이면 바로 부드럽게 사용할 수 있어요.", "유산지가 충분히 커야 속 재료가 많아도 깔끔하게 말 수 있어요. 말다가 중간에 멈추면 먹을 때 속재료가 쏟아질 수 있으니 끝까지 단단히 말아주세요."], "source_url": "https://youtu.be/_x7kgY0gyQY", "hero_local": "images/비키당_랩_저탄수_또띠아___x7kgY0gyQ.webp", "step_images": []}, {"menu": "살치살 통밀 파스타", "subtitle": "단백질 듬뿍 다  섞어주세요.", "팬을 중저불로 예열하고 올리브오일을 살짝 두른 뒤 계란물을 부어주세요. 주걱으로 휘젓지 말고 바닥부터 살살 밀듯이 뒤집어 가며 부드럽게 익혀주세요. 빵 크기에 맞게 모양을 잡아 주세요. 완성되면 접시에 옮겨 두세요.", "팬을 한 번 닦은 뒤 센 불로 올려 주세요. 양파 2조각과 토마토 2조각(총 4조각 중 2조각)을 기름 없이 올리고, 토마토 위에만 소금과 올리브오일을 살짝 뿌려 주세요. 약 50% 정도만 익혀 뒤집어 주세요.", "토마토와 양파를 뒤집을 즈음에 버섯을 팬에 함께 넣어 볶아주세요. 버섯이 맛있게 익으면 재료를 모두 꺼내 접시에 담아 두세요.", "구운 식빵 위에 물기를 닦은 로메인 상추를 빵 전체를 덮도록 올려주세요.", "상추 위에 치즈 1장, 구운 양파 2조각, 구운 토마토 2조각, 버섯, 스크램블 에그 순으로 올려주세요.", "그 위에 남은 생토마토 2조각, 치즈 1장, 로메인 상추를 올린 뒤 나머지 식빵으로 덮어주세요.", "랩이나 종이호일로 샌드위치를 단단하게 감싸 고정한 뒤 반으로 잘라 주세요. 수분기가 많으니 끝부터 조심스럽게 드세요."], "step_tips": ["기름 없이 팬에 굽는 방식이 토스터기보다 더 고소하고 맛있어요.", "간장을 먼저 무친 뒤 참기름을 넣어야 간장이 재료에 잘 배어요.", "", "", "스크램블은 절대 세게 휘젓지 말고, 중약불에서 바닥부터 살살 밀어 올리듯 익혀야 부드럽고 고급스러운 식감이 나요.", "토마토와 양파는 너무 오래 익히면 흐물흐물해지니 50% 정도만 익혀주세요.", "버섯도 너무 오래 볶지 않아야 쫄깃한 식감이 살아 있어요.", "로메인 상추의 물기를 충분히 닦아야 식빵이 눅눅해지지 않아요.", "", "", "수분기가 많은 샌드위치이므로 랩으로 단단히 감싼 뒤 자르면 모양이 덜 무너져요."], "source_url": "https://youtu.be/pttyEJMLXlM", "hero_local": "images/스크램블_버섯_샌드위치__pttyEJMLXl.webp", "step_images": []}, {"menu": "스팀 그린빈 (Steamed Green Beans)", "subtitle": "", "cuisine": "반찬/사이드", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저속노화", "칼로리"], "situations": ["밀프렙", "도시락"], "audiences": ["다이어터", "1인가구"], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "손질된 그린빈 (세척·손질 완료 제품)", "수량": "적당량"}], "steps": ["냄비 바닥에 몇 인치 정도 물을 붓고 끓인다.", "스티머 바스켓을 냄비에 올리고 그린빈을 담은 뒤 뚜껑을 덮는다.", "3~4분간 쪄서 알 덴테 식감이 되도록 한다. 선명한 밝은 초록색이 되면 완성이다.", "그린빈을 꺼내 밀폐 용기에 바로 담고, 뚜껑을 닫기 전에 실온에서 완전히 식힌다."], "step_tips": [], "source_url": "https://www.youtube.com/watch?v=ltaz1HVgktQ#r2", "hero_local": "images/ltaz1HVgktQ_r2.webp", "step_images": []}, {"menu": "스팀 양배추·당근 라페", "subtitle": "", "cuisine": "", "score": 0, "tags": [], "purposes": [], "situations": [], "audiences": [], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "당근", "수량": "1개"}, {"이름": "양배 면 파스타", "subtitle": "라면 스프 같은 감칠맛 폭발", "cuisine": "양식", "score": 0, "tags": ["최소가공", "혈당 안전", "비유탕", "건강한 지방", "Dito 추천"], "purposes": [], "situations": ["한그릇"], "audiences": ["1인가구", "직장인"], "difficulty": "중급", "cooking_time": 25, "serving": "1인분 (아이 기준 2인분)", "calorie": 550, "storage": "즉시 섭취 권장 (면이 불어 식감이 떨어지므로 보관 비권장)", "ingredients": [{"이름": "쌀면", "수량": "120g", "분류": "주재료"}, {"이름": "마늘", "수량": "5알 (편 썰기)", "분류": "주재료"}, {"이름": "이탈리안 파슬리", "수량": "2~3줄기 (잎 약 6g)", "분류": "주재료"}, {"이름": "앤초비 필레", "수량": "12~15g (약 2~3조각)", "분류": "주재료"}, {"이름": "올리브 오일", "수량": "3T (볶음용) + 마무리용 적당량", "분류": "양념"}, {"이름": "버터", "수량": "30g", "분류": "양념"}, {"이름": "크러시드 페퍼 (또는 페퍼론치노)", "수량": "0.5~1g (페퍼론치노 2~4개)", "분류": "양념"}, {"이름": "소금", "수량": "4g (면수용)", "분류": "양념"}, {"이름": "후추", "수량": "적당량", "분류": "양념"}, {"이름": "멸치액젓 (선택)", "수량": "약 10방울 (1g 내외)", "분류": "양념"}, {"이름": "물", "수량": "750ml (면수용)", "분류": "기타"}, {"이름": "달걀 노른자 (선택)", "수량": "1개", "분류": "기타"}], "steps": ["깊은 팬이나 냄비에 물 750ml와 소금 4g을 넣고 센 불에 올려 끓여주세요.", "이탈리안 파슬리는 줄기를 떼어내고 잎만 모아 돌돌 말아서 곱게 다져주세요.", "마늘 5알은 꼭지를 잘라내고 편으로 얇게 썰어주세요.", "물이 끓으면 쌀면 120g을 넣고 1분간 삶아주세요.", "1분이 지나면 불을 끄고 면수 약 150~200ml를 컵에 따로 담아두세요. 삶은 면은 채망에 건져 찬물에 헹궈 전분을 빼고 물기를 충분히 빼주세요. 이때 면이 해파리냉채처럼 약간 쫄깃하고 덜 익은 느낌이 좋아요.", "팬의 물기를 닦아낸 뒤 올리브 오일 3T를 두르고, 편 썬 마늘과 앤초비 필레, 크러시드 페퍼를 넣어주세요. 중약불에서 앤초비를 스패츌러로 으깨가며 천천히 볶아주세요.", "마늘이 연한 노란빛이 돌면 불을 약불로 낮추고 버터 30g, 다진 파슬리의 약 4/5 분량, 후추를 넣어주세요. 버터가 녹도록 저어가며 살짝 끓인 뒤 불을 꺼주세요.", "면수 150ml와 액젓(선택, 약 10방울)을 넣고 잘 섞어주세요. 이때 국물 간을 꼭 확인해주세요. 일반 국보다는 살짝 짭짤하고 바닷물보다는 싱거운 정도가 적당해요. 간이 부족하면 액젓을 조금 더, 너무 짜면 생수를 조금 더해 조절해주세요.", "다시 불을 켜고 소스가 끓어오르면 헹궈둔 쌀면을 넣고 1분간 소스에 뒤적이며 익혀주세요.", "1분이 지나면 불을 끄고 면의 간과 식감을 확인해주세요. 겉은 부드럽지만 속은 약간 덜 익은 듯한 느낌이 좋아요. 간이 부족하면 소금이나 액젓을, 너무 짜면 생수를 조금 넣어 조절해주세요.", "소스가 살짝 자작해지면 올리브 오일을 듬뿍 둘러주세요. 달걀 노른자를 넣고 싶으시다면 이 단계에서 넣고 잔열로 섞어주시면 더욱 쫀득하고 감칠맛이 살아나요. 골고루 뒤적여 마무리해주세요.", "접시에 보기 좋게 담고 남겨둔 파슬리를 뿌려주세요. 취향에 따라 후추를 한 번 더 갈아 올리거나 레지아노 치즈를 갈아 토핑해도 좋아요."], "step_tips": ["", "", "", "쌀면은 보통 4~4분 30초가 완성 삶기 시간이지만, 나중에 소스에서 한 번 더 익히므로 여기서는 1분만 삶아주세요.", "쌀면은 찬물에 꼭 헹궈야 전분이 빠져서 나중에 소스가 면에 잘 코팅돼요. 여기서 너무 흐물거리면 소스에서 끓일 때 많이 퍼질 수 있으니 주의해주세요.", "앤초비는 고온에서 볶으면 비린맛이 날 수 있으니 반드시 약불~중약불에서 녹이듯 천천히 볶아주세요. 마늘도 태우면 쓴맛이 나니 불 조절에 신경 써주세요.", "마늘이 연한 노란빛이 되는 순간이 타이밍이에요. 너무 오래 볶으면 쓴맛이 나니 색을 잘 확인하면서 진행해주세요.", "처음 만드신다면 간을 조금 아쉬운 듯 맞추고 마지막에 소금으로 조절하는 방식이 실패를 줄이는 데 도움이 돼요.", "면수를 생수 대신 사용하는 이유는 소스와 버터·오일이 유화되도록 도와서 라면처럼 끈적하게 소스가 면에 잘 붙게 해주기 때문이에요.", "쌀면은 밀가루 파스타면보다 금방 퍼지니 1분을 꼭 지켜주세요. 너무 오래 두면 식감이 많이 떨어져요.", "올리브 오일 피니시는 면이 서로 들러붙지 않게 해주고 풍미도 더해줘요. 달걀 노른자를 넣을 때는 불을 완전히 끈 상태에서 잔열로 익혀주세요.", ""], "source_url": "https://youtu.be/yfA8XBCk6po", "hero_local": "", "step_images": []}, {"menu": "양념 목살 포케", "subtitle": "", "cuisine": "잡곡밥", "score": 0, "tags": ["혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저당", "단백질"], "situations": ["밀프렙", "도시락", "한그릇"], "audiences": ["1인가구", "직장인", "다이어터"], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "목살", "수량": "300g (2회 분량)"}, {"이름": "알룰로스", "수량": "2스푼"}, {"이름": "굴소스", "수량": "2스푼"}, {"이름": "간장", "수량": "4스푼"}, {"이름": "다진 마늘", "수량": "1스푼"}, {"이름": "느타리 버섯", "수량": "적당량"}, {"이름": "잡곡밥", "수량": "1인분"}, {"이름": "양상추", "수량": "적당량"}, {"이름": "양파(채썰어 물에 담근 것)", "수량": "적당량"}, {"이름": "오이(껍질·씨 제거 후 한입 크기)", "수량": "적당량"}, {"이름": "크래미(뜨거운 물에 데쳐 찢은 것)", "수량": "적당량"}, {"이름": "옥수수(통조림, 뜨거운 물에 헹군 것)", "수량": "적당량"}, {"이름": "파프리카(채썬 것)", "수량": "적당량"}, {"이름": "당근라페", "수량": "적당량"}, {"이름": "방울토마토", "수량": "적당량"}, {"이름": "올리브", "수량": "적당량"}, {"이름": "양파 후레이크", "수량": "적당량"}], "steps": ["목살에 알룰로스 2스푼, 굴소스 2스푼, 간장 4스푼, 다진 마늘 1스푼을 넣고 볶는다.", "느타리 버섯을 함께 넣어 볶아 양념 목살을 완성한다.", "그릇에 양상추, 양파, 오이, 크래미, 옥수수, 파프리카, 당근라페, 방울토마토, 올리브, 양파 후레이크, 잡곡밥을 담는다.", "양념 목살을 위에 올려 완성한다. (별도 드레싱 없이도 충분히 맛있다.)"], "step_tips": [], "source_url": "https://youtu.be/rYaySqdbch8#r5", "hero_local": "images/rYaySqdbch8_r5.webp", "step_images": []}, {"menu": "양배추 김 샐러드 포케", "subtitle": "", "cuisine": "샐러드", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": [], "situations": ["도시락"], "audiences": ["1인가구", "직장인"], "difficulty": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "양배추", "수량": "적당량"}, {"이름": "김", "수량": "적당량"}, {"이름": "토핑 재료", "수량": "적당량"}], "steps": ["양배추를 채 썰어 준비한다.", "김을 적당한 크기로 썰거나 부순다.", "양배추와 김을 섞어 샐러드 포케 형태로 도시락에 담는다."], "step_tips": [], "source_url": "https://www.youtube.com/watch?v=IYUq4kD0U7g#r10", "hero_local": "images/IYUq4kD0U7g_r10.webp", "step_images": []}, {"menu": "양배추 김밥", "subtitle": "밥 없이 씹는 맛 대박 다이어트 김밥", "cuisine": "한식", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "Dito 추천"], "purposes": ["저당", "단백질"], "situations": ["밀프렙", "도시락"], "audiences": ["1인가구", "직장인", "다이어터"], "difficulty": "중급", "cooking_time": 45, "serving": "3~4인분", "calorie": 180, "storage": "냉장 1일 — 당일 섭취를 권장하며, 보관 시 냉장 후 다음날 안에 드세요.", "ingredients": [{"이름": "양배추", "수량": "1/4통", "분류": "주재료"}, {"이름": "계란", "수량": "10개", "분류": "주재료"}, {"이름": "당근", "수량": "1개", "분류": "주재료"}, {"이름": "부추", "수량": "200g", "분류": "주재료"}, {"이름": "통 단무지", "수량": "1개", "분류": "주재료"}, {"이름": "김", "수량": "적당량", "분류": "주재료"}, {"이름": "전분가루", "수량": "2큰술", "분류": "기타"}, {"이름": "소금", "수량": "적당량", "분류": "양념"}, {"이름": "식용유", "수량": "적당량", "분류": "양념"}], "steps": ["양배추는 겉껍질을 제거하고 반으로 잘라주세요. 채칼을 이용해 세로 방향으로 최대한 얇게 채 썰어주세요. (특유의 향이 싫으신 분은 5분 정도 물에 담갔다가 씻어주세요.)", "당근도 채칼로 얇게 채 썰어주세요.", "단무지는 얇게 편으로 썰어주세요. 개수는 기호에 맞게 조절해 주세요.", "부추는 자르지 않고 흐르는 물에 3번 씻어 준비해주세요.", "얇은 웍에 식용유를 조금 두르고 센 불로 예열한 뒤 부추를 넣고 소금 한 꼬집을 더해 빠르게 볶아주세요. 숨이 죽으면 불을 끄고 꺼내주세요.", "같은 웍에 식용유를 조금 더 두르고 당근을 넣은 뒤 소금 한 꼬집을 넣어 센 불에서 볶아주세요. 물기 없이 볶아지면 꺼내주세요.", "볼에 물기를 뺀 채 썬 양배추를 담고, 계란을 반죽이 될 만큼 넣어주세요. 소금 한 꼬집과 전분가루 2큰술을 넣고 잘 섞어주세요.", "사각 팬을 예열한 뒤 식용유를 얇게 두르고, 양배추 반죽을 도톰하게 펴주세요. 센 불로 조리하며 뒤집개로 꼭꼭 눌러주세요. 수분이 빠지면 뒤집어서 잔열로 나머지를 익혀주세요.", "완성된 양배추 지단을 식힌 뒤 2등분으로 잘라주세요. 이 방법으로 여러 장 만들어주세요.", "김발 위에 양배추 지단을 올리고, 볶은 부추·단무지·볶은 당근을 속재료로 올린 뒤 김발로 꼭꼭 눌러 단단히 말아주세요.", "김으로 바깥을 감싸듯 말아주세요. 이음새가 아래로 가도록 잠시 눌러 고정한 뒤 먹기 좋은 크기로 썰어 담아주세요."], "step_tips": ["채칼을 사용하면 칼보다 식감이 훨씬 부드럽고 얇게 썰려요. 면장갑을 꼭 착용해주세요.", "", "무게보다 개수로 조절하시면 돼요. 야채를 많이 드시고 싶으면 더 넣어주셔도 좋아요.", "", "센 불에서 빠르게 볶아야 물기 없이 깔끔하게 완성돼요. 오래 볶으면 숨이 너무 죽으니 주의해주세요.", "얇은 웍을 사용하면 물이 생기지 않아 더 좋아요.", "간은 삼삼하게 맞춰주세요. 너무 짜면 야채 본연의 단맛을 느끼기 어려워요. 전분가루는 재료가 잘 엉기도록 도와줘요.", "약한 불로 하면 양배추에서 수분이 나와 지단이 축 처지니, 반드시 센 불로 빠르게 조리해주세요.", "뜨거울 때 바로 자르거나 싸면 부서지기 쉬우니, 한 김 식힌 후 사용해주세요.", "속재료를 올릴 때 손으로 꼭꼭 눌러주셔야 단단하게 말려요.", "이음새 부분이 밑으로 오도록 놓아 모양을 잡아주세요."], "source_url": "https://youtu.be/7RYKvLft1ik", "hero_local": "images/양배추_김밥__7RYKvLft1i.webp", "step_images": []}, {"menu": "양배추 김밥", "subtitle": "살 빠지는 다이어트 김밥", "cuisine": "한식", "score": 0, "tags": ["최소가공", "혈당 안전", "비유탕"], "purposes": ["저당", "칼로리"], "situations": ["밀프렙", "도시락"], "audiences": ["1인가구", "직장인", "다이어터"], "difficulty": "중급", "cooking_time": 50, "serving": "6줄 (약 3~4인분)", "calorie": 320, "storage": "냉장 보관 시 당일 섭취 권장, 남은 경우 랩에 싸서 냉장 1일 이내 섭취해주세요.", "ingredients": [{"이름": "양배추", "수량": "1/2통 (300g)", "분류": "주재료"}, {"이름": "밥", "수량": "300g", "분류": "주재료"}, {"이름": "계란", "수량": "4~5개 (6줄 기준)", "분류": "주재료"}, {"이름": "당근", "수량": "1개 (검지 손가락 길이)", "분류": "주재료"}, {"이름": "무", "수량": "1/3개", "분류": "주재료"}, {"이름": "부추", "수량": "한 줌 (30~50g)", "분류": "주재료"}, {"이름": "로메인(청상추)", "수량": "적당량", "분류": "주재료"}, {"이름": "김밥김", "수량": "6장", "분류": "기타"}, {"이름": "소금", "수량": "1/2 작은술 (계란용) + 1 작은술 (무용) + 약간 (당근용)", "분류": "양념"}, {"이름": "참기름", "수량": "1큰술 (양배추밥용) + 2큰술 (당근용) + 약간 (마무리용)", "분류": "양념"}, {"이름": "참깨", "수량": "넉넉하게", "분류": "고명"}, {"이름": "감미료", "수량": "2큰술", "분류": "양념"}, {"이름": "식초 (사과 식초)", "수량": "2큰술", "분류": "양념"}, {"이름": "식용유", "수량": "적당량", "분류": "양념"}], "steps": ["양배추는 조각낸 뒤 충분한 물에 잠기도록 무거운 것으로 눌러 3분간 담가 두었다가, 잎 사이사이를 벌려 흐르는 물에 헹궈주세요.", "양배추를 가늘게 채 썰고 너무 길면 반으로 잘라주세요. 채칼을 사용하면 더 빠르고 편리해요.", "채 썬 양배추 300g을 뚜껑 없이 전자레인지(700W)에 3분간 돌려주세요.", "익힌 양배추를 뒤적여 수분을 날리고 보송보송하게 충분히 식혀주세요.", "식힌 양배추에 밥 300g을 넣고 자르듯이 섞어 골고루 섞어주세요.", "양배추 밥에 소금 약간, 참깨 넉넉하게, 참기름 1큰술을 넣고 잘 섞어 간을 맞춰주세요.", "양배추 밥의 절반은 따로 덜어 뚜껑을 덮어 마르지 않게 보관하고, 나머지 절반에는 잘게 다진 부추를 섞어 부추 양배추 밥을 만들어주세요.", "계란에 소금 1/2 작은술과 참기름 1큰술을 넣고 y": "", "cooking_time": 0, "serving": "", "calorie": 0, "storage": "", "ingredients": [{"이름": "오트밀", "수량": "4스푼(30g)"}, {"이름": "플레인 요거트(무설탕)", "수량": "8스푼(120g)"}, {"이름": "견과류", "수량": "적당량"}, {"이름": "과일", "수량": "적당량"}], "steps": ["먹을 그릇에 오트밀 4스푼(30g)과 무설탕 플레인 요거트 8스푼(120g)을 넣고 골고루 섞는다.", "우유나 두유를 섞을 경우 요거트 양을 그만큼 줄인다.", "뚜껑을 덮어 냉장고에 4시간 이상(잠들기 전에 넣으면 아침식사 활용 가능) 보관한다.", "먹기 직전 원하는 과일과 견과류를 위에 올려 완성한다."], "step_tips": [], "source_url": "https://youtu.be/KgkmJLISoH4#r2", "hero_local": "images/KgkmJLISoH4_r2.webp", "step_images": []}, {"menu": "오분도미 채소밥 & 닭가슴살 새송이버섯 조림 밀프렙", "subtitle": "혈당 걱정 없는 6일치 균형 식단", "cuisine": "잡곡밥", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저속노화", "칼로리", "저당", "단백질", "프로틴"], "situations": ["밀프렙", "도시락", "한그릇"], "audiences": ["1인가구", "직장인", "운동인", "다이어터"], "difficulty": "중급", "cooking_time": 70, "serving": "6인분 (6일치 밀프렙)", "calorie": 420, "storage": "냉동 보관 — 6일(1주일) 이내 섭취 권장", "ingredients": [{"이름": "오분도미", "수량": "3컵", "분류": "주재료"}, {"이름": "닭가슴살", "수량": "800g", "분류": "주재료"}, {"이름": "브로콜리", "수량": "적당량", "분류": "주재료"}, {"이름": "당근", "수량": "2개", "분류": "주재료"}, {"이름": "새송이버섯", "수량": "3개", "분류": "주재료"}, {"이름": "팽이버섯", "수량": "150g (1개)", "분류": "주재료"}, {"이름": "대파", "수량": "2개 (한 뼘 길이)", "분류": "주재료"}, {"이름": "고추", "수량": "2개", "분류": "주재료"}, {"이름": "브로콜리 밑동 (다진 것)", "수량": "4큰술", "분류": "주재료"}, {"이름": "올리브 오일", "수량": "적당량", "분류": "양념"}, {"이름": "청주", "수량": "3큰술", "분류": "양념"}, {"이름": "생강", "수량": "약간", "분류": "양념"}, {"이름": "후추", "수량": "약간", "분류": "양념"}, {"이름": "감미료", "수량": "2큰술", "분류": "양념"}, {"이름": "마늘", "수량": "2큰술", "분류": "양념"}, {"이름": "간장", "수량": "3큰술", "분류": "양념"}, {"이름": "치킨스톡", "수량": "1/2개 (생략 가능)", "분류": "기타"}, {"이름": "물 (찜용)", "수량": "500ml", "분류": "기타"}], "steps": ["오분도미 3컵을 깨끗하게 씻은 뒤 솥에 담아 잠시 불려 주세요.", "팽이버섯 밑동을 자르고 약 7mm 길이로 잘게 잘라 준비해 주세요. 밑동은 잘 떼어 분리해 주세요.", "브로콜리는 꼼꼼히 세척한 뒤 작은 송이로 나눠 주세요. 밑동은 질긴 겉껍질과 단단한 아랫부분만 제거하고 나머지는 굵게 다져 4큰술 분량을 준비해 주세요.", "씻어 둔 오분도미에 다진 브로콜리 밑동과 팽이버섯을 올리고, 올리브 오일을 넣은 뒤 물 2.5컵을 부어 밥을 지어 주세요. 압력 모드보다 무압 모드를 권장해요.", "당근은 껍질을 최소한으로 벗기고 1cm 두께로 썬 뒤 한 입 크기로 잘라 찜기에 펼쳐 주세요.", "냄비에 물 500ml를 붓고 끓으면 찜기를 올려 주세요. 브로콜리를 당근 위에 얹고 10분간 쪄 주세요. 중간에 브로콜리를 뒤집어 골고루 익혀 주세요.", "대파는 손가락 한 마디 길이로 썰고, 새송이버섯은 반으로 자른 뒤 어슷 썰어 주세요. 고추는 어슷 썰어 준비해 주세요.", "닭가슴살은 비스듬히 도톰하게 썰어 주세요. 청주 3큰술, 생강 약간, 후추 약간, 감미료 2큰술, 마늘 2큰술을 넣고 조물조물 밑간해 주세요. 간장은 아직 넣지 않아요.", "당근이 젓가락으로 부드럽게 찔릴 정도로 익으면 찜이 완성된 거예요. 브로콜리와 당근을 꺼내 식혀 주세요.", "완성된 밥은 뜨거울 때 바로 아래위로 골고루 섞어 주세요. 덩어리지지 않도록 아래까지 뒤집어 주는 게 포인트예요.", "찜 과정에서 나온 채소 육수를 그대로 냄비에 유지하고, 치킨스톡 1/2개와 간장 3큰술을 넣어 주세요.", "밑간한 닭가슴살을 냄비에 넣고 새송이버섯, 대파를 함께 넣어 골고루 섞으면서 국물이 졸아들도록 조려 주세요.", "어느 정도 익으면 고추를 넣고 다시 뒤섞으며 간이 충분히 배도록 계속 조려 주세요. 큰 조각으로 조리다가 나중에 작게 잘라 주세요.", "밀프렙 용기(600ml, 6개)에 채소밥을 숟가락 5스푼(100~110g) 정도씩 담고, 찐 브로콜리와 당근, 닭가슴살 조림을 함께 소분해 담아 주세요.", "밀프렙 용기는 냉동 보관해 주세요. 먹을 때는 채소 → 닭가슴살 조림 → 밥 순서로 드세요."], "step_tips": ["오분도미는 백미보다 물을 약간 적게 넣어야 해요. 3컵 기준 물 2.5컵이 딱 맞아요.", "팽이버섯 밑동은 너무 작게 자르기보다 채소임을 알 수 있을 정도로 굵게 잘라 주세요.", "브로콜리는 벌레가 숨기 쉬운 구조라 꼼꼼하게 세척해 주세요. 다진 밑동은 1회분씩 소분해 냉동 보관하면 나중에 편리해요.", "올리브 오일을 밥에 넣으면 저항성 전분이 늘어나는 효과가 있어요. 압력 모드보다 무압 모드가 밥이 떡처럼 되지 않아 좋아요.", "", "찜기 물이 끓은 후에 찜기를 올려 주세요. 당근이 젓가락으로 부드럽게 찔리는지 확인해 익힘 정도를 체크해 주세요.", "", "닭가슴살은 너무 작게 자르면 조리면서 육즙이 빠져 퍽퍽해질 수 있어요. 처음에는 큰 조각으로 조리다가 나중에 잘라 주세요. 간장은 나중에 넣어야 고기가 부드러워요.", "", "밥은 뜨거울 때 바로 섞어야 덩어리지지 않아요. 위쪽만 섞지 말고 아래까지 골고루 뒤집어 섞어 주세요.", "찜 육수에 채소의 영양이 녹아 있으니 버리지 말고 그대로 조림 국물로 활용해 주세요.", "간을 세게 하지 않았기 때문에 국물이 충분히 졸아들도록 조려야 싱겁지 않아요.", "큰 조각으로 조리다가 마지막에 작게 잘라 주셔야 육즙이 살아 있어 더 맛있어요.", "밀프렙 용기에 카레나 김치 같은 향이 강한 음식을 보관할 때는 종이호일이나 랩으로 한 번 덮어 실리콘 뚜껑에 냄새 배는 걸 줄여 주세요.", "먹는 순서가 혈당 관리에 중요해요. 채소 → 단백질(닭가슴살·새송이버섯) → 밥 순서로 드세요."], "source_url": "https://youtu.be/gRzKXkxLtH4", "hero_local": "images/오분도미_채소밥_&_닭가슴살_새송이버섯_조림_밀프렙__gRzKXkxLtH.webp", "step_images": []}, {"menu": "오야꼬동", "subtitle": "", "cuisine": "한식", "score": 0, "tags": ["혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["칼로리", "저당", "단백질"], "situations": ["도시락", "한그릇"], "audiences": ["1인가구", "직장인", "다이어터"], "difficulty": "", "cooking_time": 0, "servin 분류": "주재료"}, {"이름": "계란", "수량": "70~80g (약 1~2개)", "분류": "주재료"}, {"이름": "에리스리톨", "수량": "25g", "분류": "양념"}, {"이름": "베이킹 파우더", "수량": "6g", "분류": "기타"}, {"이름": "잔탄검", "수량": "3꼬집 (옵션)", "분류": "기타"}, {"이름": "소금", "수량": "3꼬집", "분류": "양념"}, {"이름": "피넛버터 (필링용)", "수량": "개당 8~10g (옵션)", "분류": "주재료"}], "steps": ["아몬드 가루, 코코넛 가루, 베이킹 파우더, 잔탄검, 소금을 한 볼에 넣고 체 없이 고루 섞어주세요.", "버터는 미리 상온에 꺼내 포마드 상태(마요네즈보다 살짝 더 단단한 크림 상태)로 준비해주세요. 손으로 꾹꾹 눌러 부드럽게 만들어도 좋아요.", "부드러워진 버터에 무가당 피넛버터를 넣고 매끄럽게 잘 섞어주세요. 핸드믹서가 있으면 기계를 사용해도 좋아요.", "에리스리톨을 넣고 다시 한번 잘 섞어주세요. 단맛 취향에 따라 양을 조절하셔도 됩니다.", "계란을 세 번에 나누어 넣으면서 그때마다 고루 섞어주세요. 초반에는 주걱으로, 세 번째 계란을 넣을 때쯤에는 거품기로 바꿔 섞으면 더 수월해요.", "섞인 액체 반죽에 미리 섞어둔 가루 재료를 두 번에 나누어 넣으면서 주걱으로 자르듯 섞어주세요. 날가루가 보이지 않으면 다음 가루를 넣어주세요.", "날가루가 없어지면 손으로 반죽을 가볍게 마무리해주세요.", "반죽을 40~43g씩 분할하면 약 11개가 나와요. 반죽을 납작하게 두 장으로 나누어 한쪽에 피넛버터 8~10g을 올리고 나머지 반죽으로 덮어 잘 봉해주세요.", "오븐을 180도로 예열한 뒤, 성형한 쿠키를 넣고 12~14분간 구워주세요.", "윗면에 굵직한 크랙이 생기고 노릇하게 구워지면 완성이에요. 식힘망에 올려 충분히 식혀주세요."], "step_tips": ["코코넛 가루와 코코넛 분말은 완전히 다른 제품이니 구매 시 꼭 확인해주세요. 아몬드 가루도 100% 아몬드 가루인지 확인하는 것이 중요해요.", "버터가 너무 차가우면 잘 섞이지 않으니, 최소 30분~1시간 전에 미리 꺼내 두세요.", "기계가 없어도 손으로 충분히 섞을 수 있어요. 포기하지 마세요!", "에리스리톨 25g은 최소 기준이에요. 더 달게 드시고 싶다면 취향껏 늘려주세요.", "피넛버터 점성에 따라 반죽 되기가 달라질 수 있어서 계란을 한꺼번에 넣지 않는 것이 중요해요. 반죽 상태를 보며 조절해주세요.", "가루를 한꺼번에 다 넣으면 섞기 어려우니 꼭 두 번에 나누어 넣어주세요.", "", "송편 빚듯이 속을 채우는 방법보다, 납작하게 두 장으로 나누어 덮는 방법이 필링이 새어 나오지 않아 더 편리해요.", "오븐마다 온도 차이가 있으니 12분 후 상태를 먼저 확인해주세요.", "갓 구운 직후에는 쿠키가 무를 수 있으니 식힘망에서 완전히 식혀야 바삭한 식감이 살아나요."], "source_url": "https://youtu.be/lFuHeslmyk0", "hero_local": "images/저탄수_키토_마가렛또_쿠키__lFuHeslmyk.webp", "step_images": []}, {"menu": "전복냄비밥 with 대파 양념장", "subtitle": "탱글탱글 전복 가득 보양솥밥", "cuisine": "한식", "score": 0, "tags": ["최소가공", "비유탕", "건강한 지방"], "purposes": [], "situations": ["한그릇"], "audiences": ["1인가구", "직장인"], "difficulty": "중급", "cooking_time": 55, "serving": "3~4인분", "calorie": 520, "storage": "냉장 1일 이내 섭취 권장 (전복이 들어있어 빨리 드시는 게 좋아요)", "ingredients": [{"이름": "전복", "수량": "8개", "분류": "주재료"}, {"이름": "멥쌀", "수량": "2컵(400cc)", "분류": "주재료"}, {"이름": "밥물", "수량": "2와 1/2컵(500cc)", "분류": "기타"}, {"이름": "무염버터", "수량": "2큰술", "분류": "양념"}, {"이름": "쪽파", "수량": "1/2컵", "분류": "고명"}, {"이름": "청주", "수량": "1큰술", "분류": "양념"}, {"이름": "곱게 간 마늘 (밑간용)", "수량": "1작은술", "분류": "양념"}, {"이름": "대파 (양념장용)", "수량": "2대", "분류": "주재료"}, {"이름": "곱게 간 마늘 (양념장용)", "수량": "1작은술", "분류": "양념"}, {"이름": "진간장", "수량": "5큰술", "분류": "양념"}, {"이름": "국간장", "수량": "1큰술", "분류": "양념"}, {"이름": "생수 (양념장용)", "수량": "6큰술", "분류": "기타"}, {"이름": "물엿", "수량": "2큰술", "분류": "양념"}, {"이름": "참기름", "수량": "1큰술", "분류": "양념"}, {"이름": "들깨가루", "수량": "2큰술", "분류": "양념"}, {"이름": "다진 청양고추", "수량": "1개분", "분류": "양념"}], "steps": ["전복 껍데기 바깥쪽에 붙은 바다 이끼를 솔이나 새 칫솔로 꼼꼼히 문질러 깨끗이 씻어주세요.", "숟가락을 전복의 얇은 쪽에 대고 눌러 살을 껍데기에서 분리해주세요.", "전복 살에서 게웃(내장)을 분리하고, 앞쪽 톱니 모양 부분을 잘라 안쪽 이빨을 제거해주세요.", "게웃은 따로 잘게 다져두고, 전복 살은 적당히 두툼하게 어슷 썰어주세요.", "썰어둔 전복 살과 다진 게웃을 볼에 담고 청주 1큰술, 곱게 간 마늘 1작은술을 넣어 고루 버무려 밑간해주세요.", "멥쌀은 미리 불려 냄비에 담고 밥물 2와 1/2컵을 부어주세요.", "밑간한 전복과 게웃을 그대로 냄비에 넣고 뚜껑을 덮어 센 불에서 끓여주세요.", "밥이 끓는 동안 대파 양념장을 만들어주세요. 다진 대파(흰 부분~연녹색 부분 2대 분량), 다진 청양고추 1개, 곱게 간 마늘 1작은술, 국간장 1큰술, 진간장 5큰술, 생수 6큰술, 물엿 2큰술, 참기름 1큰술, 들깨가루 2큰술을 모두 넣고 잘 섞어주세요.", "밥물이 거의 잦아들면 30초 정도 그대로 두었다가 불을 약하게 줄여주세요.", "약불로 줄인 뒤 12분간 뚜껑을 덮고 뜸을 들여주세요.", "뚜껑을 열고 무염버터 2큰술을 넣어 버터가 녹을 때까지 밥을 고루 섞어주세요.", "쪽파 1/2컵을 넣고 한 번 더 고루 섞어준 뒤 그릇에 담아주세요.", "대파 양념장을 곁들여 비벼 드시면 완성이에요."], "step_tips": ["이끼를 완전히 제거해야 전복 특유의 비린맛이 줄어들어요.", "숟가락을 너무 깊이 넣으면 살이 손상될 수 있으니 살살 눌러주세요.", "이빨 부분은 드시는 게 아니니 꼭 제거해주세요.", "전복은 두툼하게 썰어야 씹는 맛이 살아나요.", "청주 대신 소주를 쓰셔도 되지만, 청주가 비린맛 제거에 더 효과적이에요.", "", "센 불에서 끓이다 보면 3분 내외로 끓기 시작해요. 그 사이 양념장을 만들면 시간을 효율적으로 쓸 수 있어요.", "설탕은 간장에 잘 녹지 않으니 반드시 물엿을 사용해주세요.", "밥물이 완전히 없어지기 전에 불을 줄여야 누룽지가 지나치게 생기지 않아요.", "뜸 들이는 12분 동안 절대 뚜껑을 열지 말아주세요.", "버터가 완전히 녹아야 밥에 윤기가 좔좔 흘러 훨씬 맛있어요.", "", ""], "source_url": "https://youtu.be/Y2Pqo9o1j74", "hero_local": "images/전복냄비밥_with_대파_양념장__Y2Pqo9o1j7.webp", "step_images": []}, {"menu": "제육 묵은지김밥", "subtitle": "매콤 제육볶음과 묵은지의 환상 궁합", "cuisine": "한식", "score": 0, "tags": ["최소가공", "혈당 안전", "비유탕", "건강한 지 , "분류": "고명"}], "steps": ["감자는 0.3cm 두께로 얇게 썰어주세요. 감자볶음 할 때와 비슷한 두께면 적당해요.", "멸치 10마리는 다시팩에 담아주세요. 머리와 내장은 제거하지 않아도 괜찮아요.", "냄비에 물을 적당량 붓고 멸치 다시팩, 썰어둔 감자를 함께 넣어주세요.", "토마토는 껍질을 벗겨주세요. 단단한 토마토는 감자 깎는 칼로 직접 벗기고, 무른 토마토는 윗면에 십자 칼집을 낸 후 뜨거운 물에 잠깐 담갔다가 찬물에 헹궈 벗겨주세요.", "껍질 벗긴 토마토는 심지 부분만 제거한 뒤 한입 크기로 사각 썰기 해주세요.", "마늘은 얇게 편 썰기 해주세요.", "쪽파는 고명으로 쓸 파란 부분을 조금 남겨두고, 나머지는 냄비에 넣어주세요.", "냄비에 썰어둔 토마토와 마늘, 쪽파(흰 부분)를 모두 넣어주세요.", "소금 2꼬집, 후추 약간, 참기름 1작은술, 올리브오일 1작은술을 넣어주세요.", "중불 이상으로 끓기 시작하면 5분간 끓여주세요. 4분쯤 지나면 감자 익힘 정도를 확인하고, 덜 익었다면 2분 더 끓여주세요. 총 8~10분을 기준으로 감자가 살살 풀어질 때까지 끓여주세요.", "끓이는 중간에 거품을 살짝 걷어내고, 소금 2꼬집을 추가해 최종 간을 맞춰주세요.", "그릇에 담고 남겨둔 쪽파 파란 부분을 송송 썰어 고명으로 올려 마무리해주세요."], "step_tips": ["너무 두껍게 썰면 짧은 조리 시간 안에 익히기 어려우니 0.3cm 정도로 얇게 썰어주세요.", "머리와 내장을 제거하지 않고 그대로 사용하면 국물이 더 깊고 진해져요.", "", "토마토가 너무 무르다면 뜨거운 물에 잠깐 담갔다 찬물에 헹구는 방법으로 껍질을 쉽게 벗길 수 있어요.", "", "", "", "", "처음부터 참기름과 올리브오일을 넣으면 끓이는 동안 향은 날아가고 깊은 감칠맛만 남아요.", "토마토를 너무 오래 끓이면 신맛이 강해지니 8~10분을 넘기지 않도록 주의해주세요. 감자가 살살 풀어지는 정도가 가장 맛있어요.", "", ""], "source_url": "https://youtu.be/z3NtqvZpLiE", "hero_local": "images/토마토_감자국__z3NtqvZpLi.webp", "step_images": []}, {"menu": "토마토 스프(소스)", "subtitle": "해독 다이어트 기본 토마토소스", "cuisine": "소스/드레싱", "score": 0, "tags": ["최소가공", "혈당 안전", "착한 탄수", "비유탕", "건강한 지방", "Dito 추천"], "purposes": ["저속노화", "저당"], "situations": ["밀프렙"], "audiences": ["1인가구", "직장인"], "difficulty": "초급", "cooking_time": 32, "serving": "4인분(소스 기준)", "calorie": 80, "storage": "냉장 2~3일 (유리용기 보관)", "ingredients": [{"이름": "완숙 토마토", "수량": "6개", "분류": "주재료"}, {"이름": "통마늘", "수량": "1컵", "분류": "주재료"}, {"이름": "소금", "수량": "1꼬집 + 1작은술", "분류": "양념"}, {"이름": "올리브오일", "수량": "1큰술 + 2큰술", "분류": "양념"}, {"이름": "월계수잎", "수량": "2~3장", "분류": "양념"}, {"이름": "바질가루", "수량": "1작은술", "분류": "양념"}, {"이름": "고춧가루", "수량": "1작은술", "분류": "양념"}, {"이름": "참치액(또는 소금, 치킨스톡)", "수량": "1작은술", "분류": "양념"}], "steps": ["완숙 토마토를 4등분으로 썰어 준비해주세요.", "냄비에 통마늘 1컵, 소금 한 꼬집, 올리브오일 1큰술을 넣고 약불에서 마늘 향이 살짝 날 때까지 볶아주세요.", "썰어 둔 토마토를 넣고 소금 1작은술, 올리브오일 2큰술을 추가해 대충 섞어주세요.", "뚜껑을 덮고 1분간 익혀 토 // cuisine 종류 모아서 필터 칩 만들기
const cuisines = [...new Set(RECIPES.map(r => r.cuisine).filter(Boolean))].sort();
const cuisineHTML = cuisines.map(c =>
  `<button class="filter-chip" data-cuisine="${c}">${c}</button>`
).join("");
document.getElementById("cuisine-filters").innerHTML = cuisineHTML;

let currentCuisine = "";
let currentQuery = "";

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function renderCard(r, idx) {
  const heroSrc = r.hero_local ? r.hero_local : "";
  const heroImg = heroSrc
    ? `<img class="thumb" src="${escapeHtml(heroSrc)}" loading="lazy" alt="${escapeHtml(r.menu)}">`
    : `<div class="thumb" style="background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;">이미지 없음</div>`;

  const scoreTag = r.score ? `<span class="tag score">${r.score}/100</span>` : "";
  const tagChips = (r.tags || []).slice(0, 4).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

  const ingredients = (r.ingredients || []).map(i => {
    const name = i["이름"] || i.name || "";
    const qty = i["수량"] || i.qty || "";
    const cat = i["분류"] || i.category || "";
    const catBadge = cat ? `<small style="color:#aaa">[${escapeHtml(cat)}]</small> ` : "";
    return `<li>${catBadge}${escapeHtml(name)} <span style="color:#888">${escapeHtml(qty)}</span></li>`;
  }).join("");

  const steps = (r.steps || []).map((s, i) => {
    const tip = (r.step_tips || [])[i];
    const tipLine = tip ? `<br><small style="color:#a48a5e">💡 ${escapeHtml(tip)}</small>` : "";
    return `<li>${escapeHtml(s)}${tipLine}</li>`;
  }).join("");

  const stepImgs = (r.step_images || []).map(si => `
    <figure>
      <img src="${escapeHtml(si.path)}" loading="lazy" alt="step ${si.n}">
      <figcaption>step ${si.n}<br>${escapeHtml((si.kr || "").slice(0, 30))}</figcaption>
    </figure>
  `).join("");
  const stepImgsBlock = stepImgs ? `<h3>과정샷</h3><div class="step-grid">${stepImgs}</div>` : "";

  return `
    <div class="card" data-idx="${idx}">
      ${heroImg}
      <div class="body">
        <div class="menu">${escapeHtml(r.menu)}</div>
        ${r.subtitle ? `<div class="subtitle">${escapeHtml(r.subtitle)}</div>` : ""}
        <div class="tags">
          ${scoreTag}
          ${r.cuisine ? `<span class="tag">${escapeHtml(r.cuisine)}</span>` : ""}
          ${tagChips}
        </div>
      </div>
      <div class="detail">
        <div class="meta-row">
          ${r.difficulty ? `<span>난이도: ${escapeHtml(r.difficulty)}</span>` : ""}
          ${r.cooking_time ? `<span>총 ${r.cooking_time}분</span>` : ""}
          ${r.serving ? `<span>${escapeHtml(r.serving)}</span>` : ""}
          ${r.calorie ? `<span>1인분 ${r.calorie}kcal</span>` : ""}
          ${r.storage ? `<span>${escapeHtml(r.storage)}</span>` : ""}
        </div>
        ${(r.purposes||[]).length ? `<h3>목적</h3><div class="tags">${r.purposes.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join("")}</div>` : ""}
        <h3>재료</h3><ul>${ingredients}</ul>
        <h3>조리법</h3><ol>${steps}</ol>
        ${stepImgsBlock}
        ${r.source_url ? `<a class="source-link" href="${escapeHtml(r.source_url)}" target="_blank">↗ 원본 영상 보기</a>` : ""}
      </div>
    </div>
  `;
}

function applyFilter() {
  const q = currentQuery.toLowerCase().trim();
  const grid = document.getElementById("grid");
  const filtered = RECIPES.filter(r => {
    if (currentCuisine && r.cuisine !== currentCuisine) return false;
    if (!q) return true;
    const blob = [r.menu, r.subtitle, r.cuisine, ...(r.tags||[]), ...(r.purposes||[]), ...(r.audiences||[])]
      .join(" ").toLowerCase();
    return blob.includes(q);
  });
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">매칭되는 레시피가 없습니다.</div>`;
    return;
  }
  grid.innerHTML = filtered.map((r, i) => renderCard(r, RECIPES.indexOf(r))).join("");
}

// 검색
document.getElementById("search").addEventListener("input", (e) => {
  currentQuery = e.target.value;
  applyFilter();
});

// cuisine 필터
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("filter-chip")) {
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    e.target.classList.add("active");
    currentCuisine = e.target.dataset.cuisine || "";
    applyFilter();
    return;
  }
  // 카드 클릭 → detail 토글
  const card = e.target.closest(".card");
  if (card) {
    const detail = card.querySelector(".detail");
    if (detail) detail.classList.toggle("open");
  }
});

applyFilter();
</script>
</body>
</html>
